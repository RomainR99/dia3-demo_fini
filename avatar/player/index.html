<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; background: transparent; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <audio id="voix" controls preload="auto"></audio>
  <script>
    // #avatar — le bouton lecture du post prévient Python, qui appelle Audio2Face
    const voix = document.getElementById("voix");
    let args = { audio: "", speech_id: "", token: "", autoplay: false };
    let ignore = false;
    let dejaJoue = "";
    let charge = "";

    function envoyer(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type,
      }, data), "*");
    }

    function valeur(value) {
      envoyer("streamlit:setComponentValue", { value: value, dataType: "json" });
    }

    function pousser(paquet) {
      // #avatar — le message direct atteint l'iframe de Bonnie. Le parent seul ne suffit pas.
      try { window.parent.__bonnieFrames = paquet; } catch (error) {}
      window.parent.postMessage(paquet, "*");
      try {
        const vues = window.parent.document.querySelectorAll('iframe[title="avatar.bonnie_view"]');
        vues.forEach(function (vue) {
          if (vue.contentWindow) vue.contentWindow.postMessage(paquet, "*");
        });
      } catch (error) {}
    }

    let contexte = null;
    let analyseur = null;
    let source = null;
    let suiviVolume = 0;

    function brancherVolume() {
      if (source) return;
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtx) return;
      contexte = new AudioCtx();
      source = contexte.createMediaElementSource(voix);
      analyseur = contexte.createAnalyser();
      analyseur.fftSize = 512;
      source.connect(analyseur);
      analyseur.connect(contexte.destination);
    }

    function suivreVolume() {
      if (!analyseur || voix.paused) {
        pousser({ type: "bonnie-niveau", jaw: 0, playing: false });
        return;
      }
      const data = new Uint8Array(analyseur.fftSize);
      analyseur.getByteTimeDomainData(data);
      let somme = 0;
      for (let i = 0; i < data.length; i++) {
        const v = (data[i] - 128) / 128;
        somme += v * v;
      }
      const rms = Math.sqrt(somme / data.length);
      // #avatar — sous ce seuil, le souffle et le bruit de fond ne comptent pas.
      const jaw = Math.max(0, (rms - 0.05) * 3.2);
      pousser({ type: "bonnie-niveau", jaw: jaw, playing: true });
      suiviVolume = requestAnimationFrame(suivreVolume);
    }

    function demarrerBouche() {
      if ((args.frames || []).length) {
        pousser({
          type: "bonnie-frames",
          token: (args.token || args.speech_id || "voix") + ":joue:" + Date.now(),
          frames: args.frames,
          sync: args.sync || "audio",
        });
      }
      try {
        brancherVolume();
        if (contexte && contexte.state === "suspended") contexte.resume();
      } catch (error) {}
      cancelAnimationFrame(suiviVolume);
      suiviVolume = requestAnimationFrame(suivreVolume);
    }

    voix.addEventListener("play", function () {
      // #avatar — le son n'est plus mis en pause. La bouche suit le volume tout de suite.
      if (ignore) ignore = false;
      demarrerBouche();
    });
    voix.addEventListener("pause", function () {
      cancelAnimationFrame(suiviVolume);
      pousser({ type: "bonnie-niveau", jaw: 0, playing: false });
    });

    window.addEventListener("message", function (event) {
      const data = event.data;
      if (!data || data.type !== "streamlit:render") return;
      args = data.args || args;
      envoyer("streamlit:setFrameHeight", { height: 54 });
      if (args.audio && charge !== args.speech_id) {
        charge = args.speech_id;
        voix.src = "data:audio/wav;base64," + args.audio;
      }
      if (args.autoplay && args.token && args.token !== dejaJoue && args.token.indexOf(args.speech_id + ":") === 0) {
        dejaJoue = args.token;
        // #avatar — Bonnie est déjà à l'écran. On lui envoie les blendshapes sans recréer le composant.
        pousser({
          type: "bonnie-frames",
          token: args.token,
          frames: args.frames || [],
          sync: args.sync || "audio",
        });
        ignore = true;
        voix.currentTime = 0;
        voix.play();
      }
    });

    envoyer("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
