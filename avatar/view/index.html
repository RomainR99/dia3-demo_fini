<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 300px; background: #f4f1ea; overflow: hidden; }
    #scene { width: 100%; height: 300px; display: block; }
    #etat {
      position: absolute; left: 12px; bottom: 8px;
      font: 13px sans-serif; color: #5c5346;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="etat">Chargement de Bonnie…</div>
  <script type="module">
    // #avatar — Bonnie, clés de bouche pilotées par les blendshapes ARKit
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const canvas = document.getElementById("scene");
    const etat = document.getElementById("etat");
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setClearColor(0xf4f1ea, 1);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(28, 16 / 9, 0.0001, 10);
    let taillePosee = "";

    function ajusterTaille() {
      // #avatar — au premier rendu la largeur vaut 0. setSize(0) la fige et Bonnie disparaît.
      const largeur = document.documentElement.clientWidth || window.innerWidth || 640;
      if (largeur < 2) return;
      const voulu = largeur + "x300";
      if (taillePosee === voulu) return;
      taillePosee = voulu;
      renderer.setSize(largeur, 300, true);
      camera.aspect = largeur / 300;
      camera.updateProjectionMatrix();
    }
    scene.add(new THREE.HemisphereLight(0xfff4e5, 0x445566, 1.1));
    const lampe = new THREE.DirectionalLight(0xffffff, 1.4);
    lampe.position.set(0.02, 0.03, 0.04);
    scene.add(lampe);

    let modele = null;
    let images = [];
    let jeton = "";
    let depart = 0;
    let enCours = false;
    let repos = { x: 0, y: 0, z: 0 };
    let clignePivot = null;
    let cligneDebut = 0;
    let prochainCligne = 0;
    // #avatar — le jeton reçu du lecteur. Un rendu Streamlit plus ancien ne doit pas le remplacer.
    let jetonMessage = "";
    // #avatar — plafond seulement. Multiplier en plus étouffait la parole.
    const CALIBRAGE = {
      JawOpen: 0.85,
      MouthClose: 0.75,
      MouthFunnel: 0.8,
      MouthPucker: 0.75,
      MouthSmileLeft: 0.8,
      MouthSmileRight: 0.8,
    };
    const SEUIL_BRUIT = 0.05;
    const LISSAGE = 0.62;
    let cible = {};
    let courant = {};
    let historique = [];

    function envoyer(type, data) {
      window.parent.postMessage(Object.assign({
        isStreamlitMessage: true,
        type: type,
      }, data), "*");
    }

    function poidsA(temps) {
      if (!images.length) return null;
      let avant = images[0];
      for (let i = 1; i < images.length; i++) {
        const apres = images[i];
        if (apres.time_code >= temps) {
          const duree = apres.time_code - avant.time_code || 1;
          const mix = Math.min(1, Math.max(0, (temps - avant.time_code) / duree));
          const poids = {};
          const noms = new Set([
            ...Object.keys(avant.weights || {}),
            ...Object.keys(apres.weights || {}),
          ]);
          noms.forEach(function (nom) {
            const a = (avant.weights && avant.weights[nom]) || 0;
            const b = (apres.weights && apres.weights[nom]) || 0;
            poids[nom] = a + (b - a) * mix;
          });
          return poids;
        }
        avant = apres;
      }
      return avant.weights || {};
    }

    function preparer(poids) {
      // #avatar — échelle, plafond, puis coupe le souffle et le bruit de fond.
      const brut = {};
      let energie = 0;
      Object.keys(poids || {}).forEach(function (nom) {
        let valeur = Math.max(0, poids[nom] || 0);
        if (nom === "JawOpen") {
          valeur += ((poids.MouthLowerDownLeft || 0) + (poids.MouthLowerDownRight || 0)) * 0.35;
          // #avatar — l'ovale reste fermé sous ~0,6. On pousse la voix dans la zone visible.
          if (valeur >= SEUIL_BRUIT) valeur = Math.pow(Math.min(1, valeur), 0.32);
        }
        const gain = CALIBRAGE[nom] !== undefined ? CALIBRAGE[nom] : 0.75;
        valeur = Math.min(gain, valeur);
        brut[nom] = valeur;
        energie = Math.max(energie, valeur);
      });
      if (energie < SEUIL_BRUIT) return {};
      return brut;
    }

    function viser(poids) {
      // #avatar — moyenne glissante, puis le rendu interpole vers cette cible.
      historique.push(preparer(poids));
      if (historique.length > 1) historique.shift();
      const noms = new Set();
      historique.forEach(function (image) {
        Object.keys(image).forEach(function (nom) { noms.add(nom); });
      });
      const moyen = {};
      noms.forEach(function (nom) {
        let somme = 0;
        historique.forEach(function (image) { somme += image[nom] || 0; });
        moyen[nom] = somme / historique.length;
      });
      cible = moyen;
    }

    function lisser(dt) {
      const pas = 1 - Math.pow(1 - LISSAGE, Math.max(dt, 0.001) * 60);
      const noms = new Set(Object.keys(cible).concat(Object.keys(courant)));
      const applique = {};
      noms.forEach(function (nom) {
        const but = cible[nom] || 0;
        const actuel = courant[nom] || 0;
        let suivant = actuel + (but - actuel) * pas;
        if (suivant < 0.004) suivant = 0;
        courant[nom] = suivant;
        if (suivant > 0) applique[nom] = suivant;
      });
      appliquer(applique);
    }

    function appliquer(poids) {
      if (!modele) return;
      modele.traverse(function (objet) {
        if (!objet.isMesh || !objet.morphTargetInfluences) return;
        for (let i = 0; i < objet.morphTargetInfluences.length; i++) {
          objet.morphTargetInfluences[i] = 0;
        }
        const dictionnaire = objet.morphTargetDictionary || {};
        Object.keys(dictionnaire).forEach(function (nom) {
          objet.morphTargetInfluences[dictionnaire[nom]] = poids[nom] || 0;
        });
      });
    }

    function animer(instant) {
      if (!jeton || !images.length) {
        enCours = false;
        return;
      }
      const temps = (instant - depart) / 1000;
      const poids = poidsA(temps);
      if (poids) viser(poids);
      const fin = images[images.length - 1].time_code || 0;
      if (temps < fin + 0.15) requestAnimationFrame(animer);
      else {
        enCours = false;
        viser({});
      }
    }

    function lancer(nouveauJeton, nouvellesImages, suivreVideo) {
      if (!nouveauJeton) return;
      const recues = nouvellesImages || [];
      // #avatar — un rendu vide ne doit pas effacer une bouche déjà lancée.
      if (!recues.length && images.length) return;
      if (nouveauJeton === jeton && recues.length === images.length) return;
      jeton = nouveauJeton;
      images = recues;
      depart = performance.now();
      etat.textContent = images.length ? "Bonnie parle" : "";
      // #avatar — pendant la vidéo, currentTime pilote la bouche. L'horloge interne la décalerait.
      if (suivreVideo) return;
      if (!enCours) {
        enCours = true;
        requestAnimationFrame(animer);
      }
    }

    function cadrer() {
      const boite = new THREE.Box3().setFromObject(modele);
      const taille = boite.getSize(new THREE.Vector3());
      const centre = boite.getCenter(new THREE.Vector3());
      const plusGrand = Math.max(taille.x, taille.y, taille.z, 0.001);
      // #avatar — le visage regarde +Z. La caméra en -Z ne montrait que la nuque.
      camera.position.set(centre.x, centre.y + plusGrand * 0.02, centre.z + plusGrand * 2.4);
      camera.near = plusGrand / 100;
      camera.far = plusGrand * 20;
      camera.lookAt(centre);
      camera.updateProjectionMatrix();
    }

    function preparerClignement() {
      // #avatar — les yeux se referment sur eux-mêmes. Pas de pastille plus grande que l'œil.
      const yeux = modele.getObjectByName("eyes");
      if (!yeux) return;
      modele.updateMatrixWorld(true);
      const centre = new THREE.Box3().setFromObject(yeux).getCenter(new THREE.Vector3());
      clignePivot = new THREE.Group();
      modele.add(clignePivot);
      clignePivot.position.copy(centre);
      modele.worldToLocal(clignePivot.position);
      clignePivot.updateMatrixWorld(true);
      const pupilles = [];
      modele.traverse(function (objet) {
        if (objet.name && objet.name.indexOf("Pupil") !== -1) pupilles.push(objet);
      });
      clignePivot.attach(yeux);
      pupilles.forEach(function (pupille) { clignePivot.attach(pupille); });
    }

    function animerClignement(now) {
      if (!clignePivot) return;
      if (!prochainCligne) prochainCligne = now + 2400 + Math.random() * 2800;
      if (!cligneDebut && now >= prochainCligne) cligneDebut = now;
      let ferme = 0;
      if (cligneDebut) {
        const u = (now - cligneDebut) / 520;
        if (u >= 1) {
          cligneDebut = 0;
          prochainCligne = now + 3400 + Math.random() * 4200;
        } else {
          const t = u < 0.38 ? u / 0.38 : (1 - u) / 0.62;
          ferme = t * t * (3 - 2 * t);
        }
      }
      clignePivot.scale.y = 1 - ferme * 0.42;
    }

    function attente(now) {
      // #avatar — tête très lente, et un clignement de temps en temps.
      const t = now / 1000;
      modele.rotation.y = repos.y + Math.sin(t * 0.42) * 0.018;
      modele.rotation.x = repos.x + Math.sin(t * 0.27) * 0.007;
      animerClignement(now);
    }

    let horloge = performance.now();
    function dessiner(now) {
      const dt = Math.min(0.05, (now - horloge) / 1000);
      horloge = now;
      ajusterTaille();
      if (modele) {
        attente(now);
        lisser(dt);
      }
      renderer.render(scene, camera);
      requestAnimationFrame(dessiner);
    }

    const chargeur = new GLTFLoader();
    chargeur.load("bonnie.glb?v=10", function (gltf) {
      modele = gltf.scene;
      scene.add(modele);
      repos.x = modele.rotation.x;
      repos.y = modele.rotation.y;
      repos.z = modele.rotation.z;
      cadrer();
      preparerClignement();
      if (images.length && jeton) {
        const poids = poidsA((performance.now() - depart) / 1000);
        if (poids) viser(poids);
        etat.textContent = "Bonnie parle";
      } else {
        etat.textContent = "";
      }
    }, undefined, function () {
      etat.textContent = "Bonnie ne s'affiche pas. Le fichier bonnie.glb est introuvable.";
    });
    requestAnimationFrame(dessiner);

    function appliquerMessage(data) {
      jetonMessage = data.token || "";
      lancer(jetonMessage, data.frames || [], data.sync === "video");
    }

    function surMessage(event) {
      const data = event.data;
      if (!data) return;
      if (data.type === "streamlit:render") {
        const args = data.args || {};
        envoyer("streamlit:setFrameHeight", { height: 300 });
        // #avatar — le rendu du haut de page porte les blendshapes après le calcul.
        lancer(args.token || "", args.frames || [], args.sync === "video");
        return;
      }
      if (data.type === "bonnie-frames") {
        appliquerMessage(data);
        return;
      }
      // #avatar — le volume ne remplace les blendshapes NVIDIA que s'il n'y en a pas.
      if (data.type === "bonnie-niveau") {
        if (images.length) return;
        if (!data.playing) {
          viser({});
          etat.textContent = "";
          return;
        }
        const jaw = Math.max(0, data.jaw || 0);
        // #avatar — le pincement refermait les lèvres pendant que la mâchoire les ouvrait.
        viser(jaw < SEUIL_BRUIT ? {} : { JawOpen: jaw });
        etat.textContent = jaw >= SEUIL_BRUIT ? "Bonnie parle" : "";
        return;
      }
      if (data.type !== "bonnie-temps" || !images.length || !data.playing) return;
      const poids = poidsA(data.time || 0);
      if (poids) viser(poids);
    }

    window.addEventListener("message", surMessage);
    window.parent.addEventListener("message", surMessage);

    try {
      if (window.parent.__bonnieFrames) appliquerMessage(window.parent.__bonnieFrames);
    } catch (error) {}

    envoyer("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
